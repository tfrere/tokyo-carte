<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Écrire sur une image</title>
<!-- Une page, aucune dépendance, aucun envoi : l'image reste dans le navigateur. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #0b0c0f; color: #e6e8eb; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; overscroll-behavior: none; }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: #12151a; border-bottom: 1px solid rgb(255 255 255 / 0.08); }
  .bar[hidden] { display: none; }
  .bar .sp { flex: 1; }
  button { min-height: 44px; padding: 0 12px; white-space: nowrap; border: 1px solid rgb(255 255 255 / 0.16); border-radius: 12px; background: none; color: #d6d9dd; font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.main { border-color: transparent; background: #e9e6de; color: #14171b; font-weight: 600; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px; touch-action: none; }
  #page { position: relative; flex: none; box-shadow: 0 6px 30px rgb(0 0 0 / 0.55); }
  #page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ink { touch-action: none; cursor: crosshair; }
  #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; margin: 14px; border: 2px dashed rgb(255 255 255 / 0.18); border-radius: 18px; text-align: center; padding: 24px; }
  #empty.over { border-color: #e9e6de; background: rgb(255 255 255 / 0.04); }
  #empty[hidden], #stage[hidden] { display: none; }
  #empty h1 { margin: 0; font-size: 22px; font-weight: 600; }
  #empty p { margin: 0; color: #9aa1a9; max-width: 38ch; }
  #empty button { min-height: 52px; padding: 0 26px; font-size: 16px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <button id="undo" type="button" disabled>Annuler</button>
  <button id="clear" type="button" disabled>Tout effacer</button>
  <span class="sp"></span>
  <button id="swap" type="button">Autre image</button>
  <button id="export" class="main" type="button">Exporter</button>
</div>

<div id="empty">
  <h1>Écrire sur une image</h1>
  <p>Choisis une photo, écris dessus au doigt ou à la souris, puis exporte le résultat. Rien n’est envoyé : tout reste dans ton navigateur.</p>
  <button class="main" id="pick" type="button">Choisir une image</button>
  <p>Tu peux aussi glisser une image ici ou la coller.</p>
</div>

<div id="stage" hidden>
  <div id="page"><canvas id="base"></canvas><canvas id="ink"></canvas></div>
</div>
<input id="file" type="file" accept="image/*">

<script>
const $ = id => document.getElementById(id)
const base = $('base'), ink = $('ink'), page = $('page'), stage = $('stage'), empty = $('empty'), bar = $('bar')
const bctx = base.getContext('2d'), ictx = ink.getContext('2d')

const MAX = 6000
const WIDTH = 0.018
let strokes = [], current = null, name = 'image'

const brush = () => Math.max(ink.width, ink.height) * WIDTH

function dot(p) {
  ictx.beginPath(); ictx.arc(p[0], p[1], brush() / 2, 0, Math.PI * 2); ictx.fill()
}

function path(points) {
  if (points.length === 1) return dot(points[0])
  ictx.beginPath()
  ictx.moveTo(points[0][0], points[0][1])
  for (let i = 1; i < points.length - 1; i++) {
    const mx = (points[i][0] + points[i + 1][0]) / 2, my = (points[i][1] + points[i + 1][1]) / 2
    ictx.quadraticCurveTo(points[i][0], points[i][1], mx, my)
  }
  const last = points[points.length - 1]
  ictx.lineTo(last[0], last[1])
  ictx.stroke()
}

function style() {
  ictx.fillStyle = ictx.strokeStyle = '#000'
  ictx.lineWidth = brush(); ictx.lineCap = ictx.lineJoin = 'round'
}

function redraw() {
  ictx.clearRect(0, 0, ink.width, ink.height); style()
  for (const s of strokes) path(s)
  $('undo').disabled = $('clear').disabled = !strokes.length
}

function fit() {
  if (!base.width) return
  const room = stage.getBoundingClientRect(), pad = 20
  const k = Math.min((room.width - pad) / base.width, (room.height - pad) / base.height)
  page.style.width = `${Math.floor(base.width * k)}px`
  page.style.height = `${Math.floor(base.height * k)}px`
}

async function load(file) {
  if (!file || !file.type.startsWith('image/')) return
  let bitmap
  try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }) }
  catch {
    bitmap = await new Promise((done, fail) => { const i = new Image(); i.onload = () => done(i); i.onerror = fail; i.src = URL.createObjectURL(file) }).catch(() => null)
  }
  if (!bitmap) return alert('Cette image n’a pas pu être lue.')
  const w0 = bitmap.width, h0 = bitmap.height, k = Math.min(1, MAX / Math.max(w0, h0))
  base.width = ink.width = Math.round(w0 * k); base.height = ink.height = Math.round(h0 * k)
  bctx.drawImage(bitmap, 0, 0, base.width, base.height)
  name = (file.name || 'image').replace(/\.[^.]+$/, '')
  strokes = []; current = null
  empty.hidden = true; stage.hidden = false; bar.hidden = false
  fit(); redraw()
}

const at = e => {
  const r = ink.getBoundingClientRect()
  return [(e.clientX - r.left) * ink.width / r.width, (e.clientY - r.top) * ink.height / r.height]
}

ink.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return
  ink.setPointerCapture(e.pointerId)
  current = [at(e)]
  style(); dot(current[0])
})
ink.addEventListener('pointermove', e => {
  if (!current) return
  const events = e.getCoalescedEvents?.() ?? [e]
  for (const ev of events) current.push(at(ev))
  redraw.pending ||= requestAnimationFrame(() => {
    redraw.pending = 0
    if (!current) return
    ictx.clearRect(0, 0, ink.width, ink.height); style()
    for (const s of strokes) path(s)
    path(current)
  })
})
const end = () => {
  if (!current) return
  strokes.push(current); current = null
  cancelAnimationFrame(redraw.pending); redraw.pending = 0
  redraw()
}
ink.addEventListener('pointerup', end)
ink.addEventListener('pointercancel', end)
ink.addEventListener('contextmenu', e => e.preventDefault())

$('undo').onclick = () => { strokes.pop(); redraw() }
$('clear').onclick = () => { if (strokes.length && confirm('Tout effacer ?')) { strokes = []; redraw() } }
$('swap').onclick = () => { if (!strokes.length || confirm('Changer d’image ? Le dessin sera perdu.')) $('file').click() }
$('pick').onclick = () => $('file').click()
$('file').onchange = e => { load(e.target.files[0]); e.target.value = '' }

$('export').onclick = async () => {
  const out = document.createElement('canvas')
  out.width = base.width; out.height = base.height
  const g = out.getContext('2d')
  g.drawImage(base, 0, 0); g.drawImage(ink, 0, 0)
  const blob = await new Promise(done => out.toBlob(done, 'image/png'))
  if (!blob) return alert('L’export a échoué (image trop grande ?).')
  const file = new File([blob], `${name}-dessin.png`, { type: 'image/png' })
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return } catch (error) { if (error.name === 'AbortError') return }
  }
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob); a.download = file.name
  document.body.append(a); a.click(); a.remove()
  setTimeout(() => URL.revokeObjectURL(a.href), 10000)
}

addEventListener('resize', fit)
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !stage.hidden) { e.preventDefault(); strokes.pop(); redraw() }
})
addEventListener('dragover', e => { e.preventDefault(); empty.classList.add('over') })
addEventListener('dragleave', () => empty.classList.remove('over'))
addEventListener('drop', e => { e.preventDefault(); empty.classList.remove('over'); load(e.dataTransfer.files[0]) })
addEventListener('paste', e => { const f = [...(e.clipboardData?.files ?? [])].find(f => f.type.startsWith('image/')); if (f) load(f) })

window.__dessin = { get strokes() { return strokes.length }, size: () => [base.width, base.height] }
</script>
</body>
</html>
